<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexusSphere Cyber Incident Challenge</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:25px;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.avatar{
    font-size:80px;
    text-align:center;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}

.question{
    background:#334155;
    padding:10px;
    margin-top:10px;
    border-radius:6px;
}

.progress{
    text-align:center;
    color:#93c5fd;
    margin-bottom:20px;
}

.logo{
    text-align:center;
    font-size:70px;
}

textarea{
    width:100%;
    height:120px;
    margin-top:10px;
    border-radius:6px;
    padding:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">🛡️</div>

<h1>NexusSphere Technologies Ltd</h1>

<h2>Cyber Incident Challenge</h2>

<div class="card">

<p>
NexusSphere Technologies has experienced a suspected cyber attack.
Your team has been appointed to investigate.
</p>

<button onclick="startInvestigation()">
Start Investigation
</button>

</div>

<div id="content"></div>

</div>

<script src="script.js"></script>

</body>
</html>
